[project]
name = "meddecide"
version = "0.0.1"
description = "MedDecide — open calibrated medical decision model and MedDecide-Bench (loop bench_v0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.12.0",
    "transformers>=4.60",
    "accelerate>=1.0",
    "datasets>=4.0",
    "huggingface-hub>=0.34",
    "pyarrow>=20.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.9",
    "httpx>=0.27",
    "tqdm>=4.66",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "jupyterlab>=4.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

# The pod's GPU is an RTX PRO 6000 Blackwell (sm_120) with CUDA 13.0; the default PyPI
# torch wheel is built for an older CUDA runtime, so torch comes from the cu130 wheel
# index. `extra-index-url` (not `index`) keeps PyPI as the primary source for everything
# else, including torch's own dependencies.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
# `datasets` 5.x + transformers 5.x are recent majors; keep resolution predictable.
resolution = "highest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meddecide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: requires a CUDA device"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "outputs", "data", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
