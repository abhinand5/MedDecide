# Osler-9B distillation arm (distill_v0 D5): the Clef-Flash text tower (D3 port) with our option-code readout,
# on the same frozen d1-ultra labels and the same recipe as the 4B arm (GOAL §3.1).
# The base is the pinned Clef-Flash snapshot, loaded in memory as its text tower (Qwen3_5TextModel via
# Qwen3_5ForConditionalGeneration.model.language_model + lm_head; meddecide.model.clef). The pre-registered
# fallback (if the port had failed) is Qwen/Qwen3.5-9B at c2022362…, recorded in STATE.md.
kl_to_base: 0.0
kl_exclude_template_prefixes: [mr_, synthea_, chart_, codiesp_, mtsamples_, mimic_, ehr_rel_, pmc_, ragtruth_, drugprot_, multicare_, clinclaim_, restyle_]
loss_weighting: per_item
option_augment_probability: 1.0
option_augment_templates: [mimic_principal_dx_v1, mimic_msdrg_v1]
output_dir: outputs/distill_v0/D5
readout: option_code
bidirectional_full_attention: false
backbone: clef
base_model: Cloudflare/clef-flash
revision: fde727a287004204b7518dcc983fe64379776712
train_path: composed-in-memory:distill_pool
dev_path: data/bench/osler_v4/fastdev_v4.jsonl
seed: 0
dtype: bfloat16
device: cuda:0
variant: bare
lora:
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]
lambda_brier: 1.0
lr: 0.001
lora_lr: 0.0001
weight_decay: 0.0
grad_clip: 1.0
batch_size: 8
max_batch_tokens: 8192
max_prompt_tokens: 16384
epochs: 1
shuffle_options: true
eval_every: 6330
eval_items: 12000
eval_batch_size: 32
log_every: 50
lr_schedule: cosine
warmup_fraction: 0.03
lr_floor: 0.1
fit_temperature: true
temperature_per_qtype: true
tripwire_grad_norm: 5000.0
tripwire_macro_floor: 0.5
tripwire_consecutive_evals: 2
selection_metric: template_macro_accuracy
gradient_checkpointing: true
checkpoint_above_tokens: 8192
distill_weight: 1.0
distill_calibration_steps: 200
distill_calibration_target: 0.40
drop_mix_templates: [fda_route_choice_v1]
