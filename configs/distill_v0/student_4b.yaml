# Osler-4B distillation arm (distill_v0 D4): the osler_v5 F2 recipe on the D2 pool, with d1-ultra KL.
# GOAL §3.1/§3.4: frozen pplx-flash backbone, LoRA r=32 alpha=32 dropout=0 on q/k/v/o, option-code readout,
# lambda_brier 1.0, per-item loss weighting, option augmentation as F2, seed 0, 63,304 steps.
# The distillation weight is pre-registered at 1.0 for the first 200 steps (the calibration), then frozen at the
# value whose predicted gradient share is 0.40 (ADVISORY §3).
kl_to_base: 0.0
kl_exclude_template_prefixes: [mr_, synthea_, chart_, codiesp_, mtsamples_, mimic_, ehr_rel_, pmc_, ragtruth_, drugprot_, multicare_, clinclaim_, restyle_]
loss_weighting: per_item
option_augment_probability: 1.0
option_augment_templates: [mimic_principal_dx_v1, mimic_msdrg_v1]
output_dir: outputs/distill_v0/D4
readout: option_code
bidirectional_full_attention: false
base_model: perplexity-ai/pplx-decider-flash-v1.2
revision: 6d771ad7b5ecff5e93b8fc7b90d4c5ccc341954d
train_path: composed-in-memory:distill_pool
dev_path: data/bench/osler_v4/fastdev_v4.jsonl
seed: 0
dtype: bfloat16
device: cuda:0
variant: bare
lora:
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]  # D33: attention only
lambda_brier: 1.0
lr: 0.001
lora_lr: 0.0001
weight_decay: 0.0
grad_clip: 1.0
batch_size: 8
max_batch_tokens: 8192
max_prompt_tokens: 16384
epochs: 1
shuffle_options: true
eval_every: 6330
eval_items: 12000
eval_batch_size: 32
log_every: 50
lr_schedule: cosine
warmup_fraction: 0.03
lr_floor: 0.1
fit_temperature: true
temperature_per_qtype: true
tripwire_grad_norm: 5000.0
tripwire_macro_floor: 0.5
tripwire_consecutive_evals: 2
selection_metric: template_macro_accuracy
gradient_checkpointing: true
checkpoint_above_tokens: 8192  # D40: checkpoint only batches above 8,192 padded tokens
backbone: pplx  # the 4B student is pplx-decider-flash-v1.2 (D39)
distill_weight: 1.0
distill_calibration_steps: 200
distill_calibration_target: 0.40
drop_mix_templates: [fda_route_choice_v1]
