# osler_v3 block recipe (ADVISORY §3, §4 X7; D33 attention-only LoRA; D40 speed recipe; D41 KL-to-base).
# Identical to configs/osler_v2/block_arm.yaml except the KL keys below, which the run driver sets per arm
# (A0: 0; A1: 0.1; A2: 0.5), and the paths and backbone, which the driver sets per run.
# tests/test_osler_v3.py checks that nothing else differs from osler_v2's recipe.
# The domain prefixes are the ADVISORY §3.2 list (src/meddecide/train/osler_v3.py DOMAIN_PREFIXES).
kl_to_base: 0.0
kl_exclude_template_prefixes: [mr_, synthea_, chart_, codiesp_, mtsamples_, mimic_, ehr_rel_, pmc_, ragtruth_, drugprot_, multicare_, clinclaim_, restyle_]
output_dir: outputs/osler_v3/X0/timing
readout: option_code
bidirectional_full_attention: false
base_model: Qwen/Qwen3.5-4B
revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
train_path: data/train/osler_v2/block_C1.jsonl
dev_path: data/bench/osler_v2/fastdev_v2.jsonl
seed: 0
dtype: bfloat16
device: cuda:0
variant: bare
lora:
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]  # D33: attention only
lambda_brier: 1.0
lr: 0.001
lora_lr: 0.0001
weight_decay: 0.0
grad_clip: 1.0
batch_size: 8
max_batch_tokens: 8192
max_prompt_tokens: 16384
epochs: 1
shuffle_options: true
eval_every: 3500
eval_items: 12000
eval_batch_size: 32
log_every: 50
lr_schedule: cosine
warmup_fraction: 0.03
lr_floor: 0.1
fit_temperature: true
temperature_per_qtype: true
tripwire_grad_norm: 5000.0
tripwire_macro_floor: 0.5
tripwire_consecutive_evals: 2
selection_metric: template_macro_accuracy
gradient_checkpointing: true
checkpoint_above_tokens: 8192  # D40: checkpoint only batches above 8,192 padded tokens
backbone: pplx  # the Stage A and B runs are on pplx-decider-flash-v1.2 (D39; osler_v2's choice)
