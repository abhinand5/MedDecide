# osler_v2 block recipe (ADVISORY W6; D33 attention-only LoRA; D40 speed recipe). The block driver
# (scripts/osler_v2/w6_block_run.py) replaces output_dir, train_path, base_model, revision and backbone per block.
# Constants that are not listed here are osler_v1's (block_arm.yaml), unchanged.
output_dir: outputs/osler_v2/W6/C0q
readout: option_code
bidirectional_full_attention: false
base_model: Qwen/Qwen3.5-4B
revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
train_path: data/train/osler_v2/block_C0.jsonl
dev_path: data/bench/osler_v2/fastdev_v2.jsonl
seed: 0
dtype: bfloat16
device: cuda:0
variant: bare
lora:
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]  # D33: attention only
lambda_brier: 1.0
lr: 0.001
lora_lr: 0.0001
weight_decay: 0.0
grad_clip: 1.0
batch_size: 8
max_batch_tokens: 8192
max_prompt_tokens: 16384
epochs: 1
shuffle_options: true
eval_every: 3500
eval_items: 12000  # the whole fast dev v2 (11,323 items)
eval_batch_size: 32
log_every: 50
lr_schedule: cosine
warmup_fraction: 0.03
lr_floor: 0.1
fit_temperature: true
temperature_per_qtype: true
tripwire_grad_norm: 5000.0
tripwire_macro_floor: 0.5
tripwire_consecutive_evals: 2
selection_metric: template_macro_accuracy
gradient_checkpointing: true
checkpoint_above_tokens: 8192  # D40: checkpoint only batches above 8,192 padded tokens
backbone: qwen  # 'pplx' for pplx-decider-flash-v1.2 (D39); the block driver sets it per block
