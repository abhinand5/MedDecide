# MedDecide-0.8B student training config (decision D3; tasks S7, S9, S10).
#
# Architecture: frozen Qwen3.5-0.8B + decision-path LoRA + pointer head. The head reads the
# hidden state at each offered option's key token and at the answer position of the *existing*
# harness rendering (src/meddecide/eval/readout.py) — this file adds no prompt format.
#
# Data paths point at the S6 training mix. Training never reads a test split.

base_model: Qwen/Qwen3.5-0.8B
revision: null            # resolved revision is recorded in the run's provenance
train_path: data/train/student_v0/train.jsonl
dev_path: data/train/student_v0/dev.jsonl
output_dir: outputs/student_v0/S9

seed: 0
dtype: bfloat16
device: cuda:0
# option letters are read as the tokens the prompt actually shows (no leading space); this is
# the variant the bench harness measured for this model family
variant: bare

# LoRA: r=16 on the attention and MLP projections. Qwen3.5 alternates full-attention and
# linear-attention layers, so both attention families are adapted (the linear-attention conv1d
# is not a projection and is not adapted). task_type="CAUSAL_LM" is set by the model code.
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_b
    - in_proj_a
    - out_proj
    - gate_proj
    - up_proj
    - down_proj

# Pointer head: [option states ; answer state] -> LayerNorm -> MLP -> one logit per option.
# option_state selects the per-option states:
#   key     = the option's key token only (the literal marker form; the causal base has not yet
#             read that option's label there — measured training accuracy 0.36 on 64 items)
#   key_end = key token + the last token of the option's line, i.e. the first position whose
#             hidden state contains the option's own label (default; this is what learns)
#   end     = line-end token only
head:
  hidden: 256
  dropout: 0.0
  option_state: key_end

# loss = cross-entropy over the offered options + lambda * Brier
lambda_brier: 1.0
lr: 1.0e-3               # pointer head (randomly initialised) — peak LR
lora_lr: 2.0e-4          # LoRA adapter (starts at zero) — peak LR
weight_decay: 0.0
grad_clip: 1.0
# LR schedule, applied when Trainer.train is given an explicit schedule_steps total (S9 passes
# the planned batch count of its one epoch): linear warmup, then cosine decay to zero, on BOTH
# parameter groups. warmup_fraction is a fraction of the scheduled steps.
lr_schedule: cosine
warmup_fraction: 0.03

batch_size: 8            # max items per batch
max_batch_tokens: 8192   # max *real* prompt tokens per batch (both limits are enforced)
max_prompt_tokens: 8192  # prompts longer than this keep their tail (question + options)
# length bucketing is confined to chunks of batch_chunk_factor * batch_size items, and both the
# chunks and the batches inside them are visited in a per-epoch shuffled order — without this,
# sorting the epoch by length produced an accidental curriculum (S9 run 1)
batch_chunk_factor: 100

epochs: 1
shuffle_options: true    # option-order augmentation, reshuffled every epoch

eval_every: 200
eval_items: 256          # the S9 CLI sets this to a per-template cap; its sample must be >= 2000
# forward-only dev scoring may use bigger batches than training (no activations are kept)
eval_batch_size: 16
eval_max_batch_tokens: 32768
log_every: 10
max_seconds: null

# Calibration: one temperature per qtype, fitted on dev after training.
fit_temperature: true
temperature_per_qtype: true
temperature_items_per_qtype: null
