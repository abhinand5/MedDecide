# osler_v1 V8 block run (ADVISORY V8): the osler_v0 arm L recipe with V0's batching (batch 8, max_batch_tokens 8,192,
# gradient checkpointing on), Qwen3.5-4B at the osler_v0 revision, option-code readout (D23, D26). The block driver
# (scripts/osler_v1/v8_block_run.py) replaces train_path, dev_path, output_dir, eval_every and the step budget per block.
output_dir: outputs/osler_v1/V8/B0
readout: option_code
bidirectional_full_attention: false
base_model: Qwen/Qwen3.5-4B
revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
train_path: data/train/osler_v1/block_B0.jsonl
dev_path: data/bench/osler_mr_v0/fastdev_mix.jsonl
seed: 0
dtype: bfloat16
device: cuda:0
variant: bare
lora:
  r: 32
  alpha: 32
  dropout: 0.0
lambda_brier: 1.0
lr: 0.001
lora_lr: 0.0001
weight_decay: 0.0
grad_clip: 1.0
batch_size: 8
max_batch_tokens: 8192
max_prompt_tokens: 16384
epochs: 1
shuffle_options: true
eval_every: 3500
eval_items: 6000
eval_batch_size: 32
log_every: 50
lr_schedule: cosine
warmup_fraction: 0.03
lr_floor: 0.1
fit_temperature: true
temperature_per_qtype: true
tripwire_grad_norm: 5000.0
tripwire_macro_floor: 0.5
tripwire_consecutive_evals: 2
selection_metric: template_macro_accuracy
gradient_checkpointing: true
